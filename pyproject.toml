[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indielens"
version = "0.1.0"
description = "Offline-first indie game recommender, starting with measurable baselines"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
indielens = "indielens.cli:main"

[tool.setuptools.packages.find]
include = ["indielens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
